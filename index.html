<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FrozenMC Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Title Bar */
    .title-bar {
      height: 32px;
      background-color: #181818;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      color: #cccccc;
      border-bottom: 1px solid #282828;
    }

    /* Main Window Layout */
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 32px);
    }

    /* Left Sidebar Navigation */
    .sidebar {
      width: 200px;
      background-color: #1f1f1f;
      display: flex;
      flex-direction: column;
      padding-top: 10px;
      border-right: 1px solid #2a2a2a;
    }

    .profile-section {
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 10px;
    }

    .avatar {
      width: 24px;
      height: 24px;
      background-color: #09add3;
      border-radius: 3px;
    }

    .nav-item {
      padding: 10px 15px;
      font-size: 13px;
      color: #aaaaaa;
      cursor: pointer;
    }

    .nav-item:hover {
      background-color: #2a2a2a;
      color: #ffffff;
    }

    .nav-item.active {
      background-color: #2d2d2d;
      color: #ffffff;
      border-left: 4px solid #09add3;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #181818;
      position: relative;
    }

    /* Top Horizontal Sub-Nav */
    .sub-nav {
      height: 45px;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 0 25px;
      background-color: #181818;
    }

    .sub-nav-item {
      font-size: 13px;
      font-weight: 600;
      color: #888888;
      cursor: pointer;
    }

    .sub-nav-item.active {
      color: #ffffff;
      border-bottom: 2px solid #09add3;
    }

    /* Hero Banner using bg.jpg */
    .hero-container {
      flex: 1;
      position: relative;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7)), url('bg.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* FrozenMC Logo Overlay */
    .logo-container {
      width: 55%;
      max-width: 480px;
      text-align: center;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.8));
    }

    /* Bottom Play Control Bar */
    .play-bar {
      width: 100%;
      height: 100px;
      background: rgba(24, 24, 24, 0.95);
      border-top: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    /* Client Selector Dropdown Box */
    .client-selector-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .client-label {
      font-size: 11px;
      color: #888888;
      text-transform: uppercase;
      font-weight: bold;
    }

    .client-select {
      width: 220px;
      background-color: #262626;
      border: 1px solid #3a3a3a;
      color: #ffffff;
      border-radius: 4px;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    .client-select option {
      background-color: #1f1f1f;
      color: #ffffff;
    }

    /* Green Launcher Play Button */
    .play-btn {
      width: 200px;
      height: 52px;
      background-color: #388e3c;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1b5e20;
      transition: background 0.1s ease;
    }

    .play-btn:hover {
      background-color: #43a047;
    }

    .play-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1b5e20;
    }

    .version-info {
      font-size: 11px;
      color: #666666;
    }
  </style>
</head>
<body>

  <!-- Top Title Bar -->
  <div class="title-bar">
    FrozenMC Client Launcher
  </div>

  <div class="container">
    <!-- Left Navigation Bar -->
    <div class="sidebar">
      <div class="profile-section">
        <div class="avatar"></div>
        <span>Player</span>
      </div>
      <div class="nav-item active">Play</div>
      <div class="nav-item">Settings</div>
    </div>

    <!-- Main View -->
    <div class="main-content">
      <!-- Top Navigation Tabs -->
      <div class="sub-nav">
        <div class="sub-nav-item active">Play</div>
        <div class="sub-nav-item">Clients</div>
        <div class="sub-nav-item">News</div>
      </div>

      <!-- Hero View using bg.jpg and logo -->
      <div class="hero-container">
        <div class="logo-container">
          <img src="frozenmc-logo.png" alt="FrozenMC Logo">
        </div>
      </div>

      <!-- Play Control Bar -->
      <div class="play-bar">
        <!-- Client Selector Dropdown -->
        <div class="client-selector-box">
          <span class="client-label">Select Client:</span>
          <select id="clientSelect" class="client-select">
            <option value="">Loading clients...</option>
          </select>
        </div>

        <!-- Green Play Button -->
        <button class="play-btn" onclick="launchGame()">PLAY</button>

        <div class="version-info">
          FrozenMC v1.0
        </div>
      </div>
    </div>
  </div>

  <script>
    let clientsData = [];

    // Fetch clients directly from clients.json
    async function loadClients() {
      try {
        const response = await fetch('clients.json');
        clientsData = await response.json();
        
        const select = document.getElementById('clientSelect');
        select.innerHTML = '';

        clientsData.forEach((client, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = client.name || client.title || `Client ${index + 1}`;
          select.appendChild(option);
        });
      } catch (err) {
        console.error('Failed to load clients.json:', err);
        document.getElementById('clientSelect').innerHTML = '<option value="">Error loading clients</option>';
      }
    }

    function launchGame() {
      const selectedIndex = document.getElementById('clientSelect').value;
      if (selectedIndex === '' || !clientsData[selectedIndex]) return;

      const client = clientsData[selectedIndex];
      // Redirects using the 'url', 'path', or 'link' key from your json object
      const targetUrl = client.url || client.path || client.link;
      if (targetUrl) {
        window.location.href = targetUrl;
      }
    }

    // Initialize on page load
    loadClients();
  </script>

</body>
</html>
